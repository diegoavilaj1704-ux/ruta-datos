# Fichas de los temas de la unidad. La app las pone en el mapa de la Ruta junto a la
# parada que los enseña; se desbloquean al terminar esa parada. Al tocarlas se ve
# qué significan y un ejemplo que se puede ejecutar. `npm run verificar` corre los ejemplos.
version: "1.0"
conceptos:
  - id: select
    parada: leccion-1
    codigo: SELECT
    titulo: "Elegir columnas"
    significado: "«Selecciona»: dice qué columnas quieres ver. Las columnas se separan con comas, sin coma después de la última."
    ejemplo: "SELECT producto, cantidad\nFROM ventas;"
  - id: from
    parada: leccion-1
    codigo: FROM
    titulo: "De qué tabla"
    significado: "«De»: dice de qué tabla salen los datos. Va después de SELECT."
    ejemplo: "SELECT producto\nFROM ventas;"
  - id: asterisco
    parada: leccion-1
    codigo: "*"
    titulo: "Todas las columnas"
    significado: "El asterisco trae todas las columnas. Úsalo para explorar; en reportes, nombra las columnas."
    ejemplo: "SELECT *\nFROM ventas;"
  - id: where
    parada: leccion-2
    codigo: WHERE
    titulo: "Filtrar filas"
    significado: "«Donde»: deja pasar solo las filas que cumplen la condición. Va siempre después de FROM."
    ejemplo: "SELECT producto, cantidad\nFROM ventas\nWHERE sucursal = 'Norte';"
  - id: comparadores
    parada: leccion-2
    codigo: "= <>"
    titulo: "Comparadores"
    significado: "`=` igual a, `<>` distinto de, `>` mayor, `<` menor. `>=` y `<=` incluyen el valor del límite."
    ejemplo: "SELECT producto, cantidad\nFROM ventas\nWHERE cantidad >= 4;"
  - id: comillas
    parada: leccion-2
    codigo: "'texto'"
    titulo: "Comillas sí o no"
    significado: "Texto y fechas van entre comillas simples y escritos tal como están en la tabla ('Norte', no 'norte'). Los números van sin comillas."
    ejemplo: "SELECT id_venta, producto\nFROM ventas\nWHERE fecha = '2026-10-02';"
  - id: explorar
    parada: proyecto-1
    codigo: "EXPLORA"
    titulo: "Explorar antes de filtrar"
    significado: "Antes de responder, mira la tabla completa y fíjate cómo están escritos los valores: mayúsculas y acentos."
    ejemplo: "SELECT *\nFROM ventas;"
  - id: reporte
    parada: proyecto-2
    codigo: "REPORTE"
    titulo: "Un buen reporte"
    significado: "Responde la pregunta en palabras de negocio y agrega un patrón que el dueño no había notado. Por ejemplo: las bebidas son 14 de las 24 piezas vendidas."
    ejemplo: "SELECT producto, cantidad, sucursal\nFROM ventas\nWHERE categoria = 'Bebidas';"
  - id: nota
    parada: repaso
    codigo: "NOTA"
    titulo: "Aprender en público"
    significado: "Tu nota: qué aprendiste, un ejemplo propio, un error que cometiste y una pregunta para quien lea."

# Tips de Hashy en el mapa. `desde` es la parada que hay que terminar para que salga
# (así no adelanta temas); sin `desde`, sale desde el principio. Se mezclan con los
# tips generales de contenido/hashy-tips.yaml y no se repiten hasta que salen todos.
# Los datos de la tabla están comprobados contra abarrotes_ventas.sql (regla 3).
tips_hashy:
  - "¡Guau! Antes de ejecutar, olfatea lo que va justo antes de FROM: ahí no va coma."
  - "Una parada al día es buen ritmo. ¡Pero si traes energía, haz dos!"
  - "Toca las gráficas junto al camino para repasar lo que ya viste."
  - texto: "SQL no distingue SELECT de select, pero escribirlo en mayúsculas hace que tu consulta se lea más fácil."
    desde: leccion-1
  - texto: "¿Sabías? La tabla ventas tiene 8 filas y 7 columnas. Pequeña para aprender, igual que las de verdad pero en miniatura."
    desde: leccion-1
  - texto: "El punto y coma al final dice «aquí termina mi consulta». Acostúmbrate a ponerlo."
    desde: leccion-1
  - texto: "Truco de analista: primero SELECT * para ver la tabla, luego nombra solo las columnas que necesitas."
    desde: leccion-1
  - texto: "Si te salen 0 filas, revisa mayúsculas y acentos del valor que filtras: 'Lácteos' no es 'lacteos'."
    desde: leccion-2
  - texto: "WHERE trabaja fila por fila: a cada una le pregunta «¿cumples?» y solo deja pasar las que dicen que sí."
    desde: leccion-2
  - texto: "Los números van sin comillas: WHERE cantidad > 2. El texto, con comillas simples: WHERE sucursal = 'Sur'."
    desde: leccion-2
  - texto: "¿Quieres todo menos algo? Usa <>: WHERE sucursal <> 'Norte' trae Centro y Sur."
    desde: leccion-2
  - texto: "En la tabla hay 3 sucursales (Norte, Centro y Sur) y 4 categorías. Pruébalo tú en el editor."
    desde: proyecto-1
  - texto: "Un buen reporte responde la pregunta del dueño en una frase, sin hablar de SQL."
    desde: proyecto-1
  - texto: "Explorar primero te ahorra errores: siempre mira cómo vienen escritos los valores antes de filtrar."
    desde: proyecto-2
  - texto: "¡Ya puedes responder preguntas reales con datos! Eso es lo que hace un Data Analyst todos los días."
    desde: repaso
