# Lección del lunes contada como historia, tarjeta por tarjeta.
# Cubre las 11 secciones de lunes.md (skill docente-datos) en formato de juego.
# Personajes: yo (el avatar del alumno; {nombre} se reemplaza por su nombre),
# rafa (Don Rafa), hashy (schnauzer de los tips). Ver docs/estilo-y-personajes.md
# Los retos usan la solución de ejercicios.json; `npm run verificar` los comprueba.
id: m02-s01-lunes-historia
version: "1.1"
pasos:
  # 1. Objetivo
  - tipo: portada

  # 2. Por qué importa
  - tipo: chat
    mensajes:
      - { quien: rafa, texto: "¡{nombre}! Qué bueno que llegas." }
      - { quien: rafa, texto: "Anoté todas las ventas de octubre en mi libreta, pero ya no le entiendo nada." }
      - { quien: yo, texto: "Tranquilo, Don Rafa. Ya pasamos todo a una tabla en la computadora." }
      - { quien: rafa, texto: "Pásame qué producto se vendió en cada venta y cuántas piezas. Nada más eso." }
      - { quien: yo, texto: "Va. Te enseño cómo se lo pedimos a la computadora." }

  # 3. Lo que ya sabes
  - tipo: tabla
    quien: yo
    texto: "Esta es la tabla **ventas**. Se lee como una hoja de Excel: cada **fila** es una venta y cada **columna** es un dato de esa venta."
    consulta: "SELECT * FROM ventas LIMIT 4;"
    nota: "Tiene 8 filas y 7 columnas. Aquí ves las primeras 4."

  - tipo: chat
    mensajes:
      - { quien: yo, texto: "Don Rafa solo quiere 2 de esas 7 columnas." }
      - { quien: yo, texto: "Para pedírselas a la computadora usamos SQL. Una **consulta** es una pregunta escrita en SQL." }

  # 4. La idea en una frase
  - tipo: idea
    texto: "Con SQL le dices a la base de datos **qué columnas** quieres ver y **de qué tabla**."

  # 5. Analogía
  - tipo: analogia
    quien: yo
    titulo: "Como pedir en una fonda"
    texto: "No dices «tráeme toda la cocina». Dices «quiero sopa y agua de jamaica». Una consulta es tu pedido: nombras lo que quieres y la tabla te lo sirve."
    limite: "Ojo: en la fonda el plato se acaba. En SQL la tabla nunca cambia; solo ves una copia con lo que pediste."

  # 6. Explicación por capas
  - tipo: conceptos
    titulo: "Las dos palabras clave"
    items:
      - { codigo: SELECT, significado: "«Selecciona»: qué columnas quieres." }
      - { codigo: FROM, significado: "«De»: de qué tabla salen." }
    nota: "Primero va SELECT y luego FROM. Las columnas se separan con comas y la consulta termina con punto y coma."

  # 7. Ejemplo resuelto
  - tipo: terminal
    quien: yo
    texto: "Así le respondo a Don Rafa. Toca **EJECUTAR**."
    codigo: |
      -- Lo que pidió Don Rafa
      SELECT producto, cantidad
      FROM ventas;
    despues: "8 filas, una por venta, y solo 2 columnas. «Refresco 600 ml» sale dos veces porque se vendió en dos ventas: SELECT no suma, solo muestra."

  - tipo: chat
    mensajes:
      - { quien: rafa, texto: "¡Eso es justo lo que quería!" }
      - { quien: yo, texto: "Ahora te toca a ti. Yo te acompaño." }

  # 9. Práctica guiada (ejercicio 1, con piezas)
  - tipo: armar
    encargo: { quien: rafa, texto: "¿Y en qué sucursal se vendió cada cosa?" }
    titulo: "Muestra las columnas `producto` y `sucursal`"
    antes: "SELECT"
    despues: "FROM ventas;"
    piezas: [sucursal, fecha, ",", producto, categoria]
    ejercicio: lunes-1

  # 8. Errores comunes
  - tipo: error
    titulo: "Caza el error: toca la pieza que sobra"
    piezas: [SELECT, producto, ",", cantidad, ",", FROM, ventas, ";"]
    error: 4
    explicacion: "Después de la última columna no va coma. Con esa coma, SQL marca error."
    pista: "Revisa lo que va justo antes de FROM."
    tip: "¡Guau! Es el error más común al empezar. Antes de ejecutar, olfatea lo que va justo antes de FROM."

  - tipo: tip
    quien: hashy
    texto: "Si se te **olvida** la coma (`SELECT producto cantidad`), SQL no marca error: te muestra una sola columna llamada «cantidad» con los productos. Si ves algo raro, revisa tus comas."

  - tipo: tip
    quien: hashy
    texto: "Escribe los nombres tal como están en la tabla. `produto` o `categoría` con acento dan un error de «no such column»."

  # 9. Práctica guiada (ejercicio 2, con piezas)
  - tipo: armar
    encargo: { quien: rafa, texto: "Para el pedido al proveedor necesito la fecha, el producto y el precio de una pieza." }
    titulo: "Muestra `fecha`, `producto` y `precio_unitario`"
    antes: "SELECT"
    despues: "FROM ventas;"
    piezas: [precio_unitario, ",", producto, cantidad, fecha, ",", sucursal]
    ejercicio: lunes-2

  # 6. Explicación por capas (capa 4: todas las columnas)
  - tipo: idea
    quien: yo
    texto: "El asterisco `*` significa **todas las columnas**."
    nota: "Úsalo para explorar. En reportes nombra las columnas: es más claro y más rápido."

  # 9. Práctica guiada (ejercicio 3, escrito a mano)
  - tipo: escribir
    encargo: { quien: rafa, texto: "Ahora enséñame toda la tabla, con todas sus columnas." }
    titulo: "Escribe la consulta completa usando `*`"
    ejercicio: lunes-3

  # 10. Revisa tu comprensión
  - tipo: quiz
    pregunta: "¿Qué hace `FROM ventas`?"
    opciones:
      - { texto: "Borra la tabla ventas.", porque: "SELECT y FROM solo leen; nunca borran ni cambian datos." }
      - { texto: "Indica de qué tabla salen los datos.", correcta: true }
      - { texto: "Elige las columnas a mostrar.", porque: "Eso lo hace SELECT. SELECT dice *qué*; FROM dice *de dónde*." }

  - tipo: quiz
    pregunta: "¿Cuál consulta está bien escrita?"
    opciones:
      - { texto: "`FROM ventas SELECT producto;`", porque: "El orden importa: SELECT siempre va primero." }
      - { texto: "`SELECT producto, FROM ventas;`", porque: "Sobra la coma antes de FROM." }
      - { texto: "`SELECT producto FROM ventas;`", correcta: true }

  - tipo: quiz
    pregunta: "Corres `SELECT producto FROM ventas;`. ¿Cuántas filas ves?"
    opciones:
      - { texto: "1, porque pediste una columna.", porque: "Elegir columnas no reduce filas. Filtrar filas lo verás mañana." }
      - { texto: "8, una por cada venta.", correcta: true }
      - { texto: "6, una por cada producto distinto.", porque: "SELECT no quita repetidos: si un producto se vendió dos veces, aparece dos veces." }

  - tipo: quiz
    etiqueta: "repaso del M1"
    pregunta: "En la tabla `ventas`, ¿qué representa una fila?"
    opciones:
      - { texto: "Un producto del catálogo.", porque: "Un mismo producto aparece en varias filas, así que una fila no puede ser «el producto»." }
      - { texto: "Una venta.", correcta: true }
      - { texto: "Una sucursal.", porque: "Hay 3 sucursales y 8 filas; cada fila dice en qué sucursal ocurrió la venta." }

  # 11. Resumen
  - tipo: resumen
    ideas:
      - "**SELECT** dice qué columnas quieres; **FROM**, de qué tabla."
      - "Las columnas van separadas por comas, sin coma después de la última."
      - "`SELECT *` trae todas las columnas; úsalo para explorar."
    cierre: { quien: rafa, texto: "Gracias, {nombre}. Mañana te pido algo más difícil: solo las ventas de una sucursal." }
