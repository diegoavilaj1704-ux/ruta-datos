# Repaso de la Unidad 2 y nota pública, contados como historia (texto completo en repaso.md).
# Primero preguntas de las lecciones 1 y 2 sin ver notas (más una de la Unidad 1); después la nota.
id: m02-s02-repaso-historia
version: "1.0"
pasos:
  - tipo: portada

  - tipo: chat
    mensajes:
      - { quien: hashy, texto: "¡Guau, {nombre}! Llegaste al repaso de la Unidad 2." }
      - { quien: hashy, texto: "Unas preguntas **sin ver tus notas**. Las que falles serán buen tema para tu nota pública." }

  - tipo: quiz
    etiqueta: "lección 1"
    pregunta: "`ORDER BY precio_unitario DESC`, ¿qué producto sale primero?"
    opciones:
      - { texto: "El más caro.", correcta: true }
      - { texto: "El más barato.", porque: "Eso sería sin DESC. DESC va de mayor a menor." }
      - { texto: "El primero que se capturó.", porque: "Eso pasa sin ORDER BY." }

  - tipo: error
    titulo: "Caza el error: toca la pieza que está fuera de lugar"
    piezas: [SELECT, producto, FROM, ventas, ORDER BY, cantidad, DESC, WHERE, "categoria = 'Bebidas'", ";"]
    error: 7
    explicacion: "WHERE va **antes** de ORDER BY: primero se filtra y después se ordena."
    pista: "Recita el orden: SELECT, FROM, WHERE, ORDER BY…"

  - tipo: quiz
    etiqueta: "lección 2"
    pregunta: "Escribes `SELECT producto, cantidad FROM ventas LIMIT 5;`. ¿Son las 5 ventas más grandes?"
    opciones:
      - { texto: "Sí, LIMIT siempre toma las más grandes.", porque: "LIMIT no sabe qué es «más grande»: corta lo que tenga enfrente." }
      - { texto: "No: son las primeras 5 que encontró SQL. Falta ORDER BY cantidad DESC.", correcta: true }
      - { texto: "No: da error porque falta WHERE.", porque: "WHERE es opcional. La consulta corre, pero no es un top." }

  - tipo: quiz
    etiqueta: "lección 2"
    pregunta: "¿Dónde va DISTINCT?"
    opciones:
      - { texto: "Justo después de SELECT.", correcta: true }
      - { texto: "Al final, después de LIMIT.", porque: "Al final va LIMIT. DISTINCT va al principio, pegado a SELECT." }
      - { texto: "Antes del nombre de cada columna.", porque: "Se escribe una sola vez, después de SELECT, y aplica a todas las columnas." }

  - tipo: quiz
    etiqueta: "repaso de la Unidad 1"
    pregunta: "`WHERE cantidad >= 30`, ¿la venta de 30 aguas entra?"
    opciones:
      - { texto: "Sí: `>=` incluye el valor del límite.", correcta: true }
      - { texto: "No: 30 no es mayor que 30.", porque: "Eso sería con `>`. La rayita de `>=` incluye el 30." }
      - { texto: "Depende de la sucursal.", porque: "La condición solo habla de la cantidad." }

  - tipo: escribir
    encargo: { quien: rafa, texto: "Una última, {nombre}: ¿cuáles fueron las 3 ventas más grandes de Norte?" }
    titulo: "Muestra `producto` y `cantidad` de las 3 ventas de `'Norte'` con la `cantidad` más grande"
    ejercicio: repaso-1

  - tipo: chat
    mensajes:
      - { quien: hashy, texto: "¡Bien olfateado! Ahora tu **nota pública**." }
      - { quien: yo, texto: "Esta semana aprendí a sacar tops y listas sin repetidos. Vale la pena contarlo." }

  - tipo: nota
    titulo: "Escribe tu nota (máximo 200 palabras)"
    plantilla:
      - "**Qué aprendí** (2 o 3 frases)."
      - "**Un ejemplo propio**: una consulta tuya, distinta a las de las lecciones."
      - "**Un error que cometí** y cómo lo resolví."
      - "**Una pregunta** para quien lea."
    temas:
      - "Un top es ordenar y después cortar: ORDER BY … DESC + LIMIT."
      - "Por qué LIMIT sin ORDER BY no es un top."
      - "DISTINCT: de 280 ventas a 16 productos."
    ejemplo: |-
      Esta semana aprendí a ordenar resultados en SQL. Con ORDER BY acomodo las filas por una columna, y con DESC las pongo de mayor a menor.

      Mi ejemplo: en las ventas de una tiendita encontré las 5 ventas más grandes del trimestre:
      SELECT producto, cantidad FROM ventas ORDER BY cantidad DESC LIMIT 5;
      Todas tenían historia: Nochebuena, Año Nuevo y Día de Muertos.

      Mi error: escribí LIMIT 5 sin ORDER BY y creí que eran las más grandes. Solo eran las primeras capturadas. Primero se ordena, después se corta.

      ¿Qué top le sacarías a los datos de tu trabajo?

      #SQL #DataAnalytics #AprendiendoEnPúblico

  - tipo: resumen
    titulo: "¡Unidad 2 completa!"
    ideas:
      - "**ORDER BY** ordena (ASC o DESC), **LIMIT** corta y **DISTINCT** quita repetidos."
      - "Un top: primero ordenar, después cortar."
      - "El orden de las piezas: SELECT, FROM, WHERE, ORDER BY, LIMIT."
    cierre: { quien: hashy, texto: "¡Guau! Unidad 2 lista, {nombre}. En la siguiente, Lupita prepara una promoción y necesita filtros más listos." }
